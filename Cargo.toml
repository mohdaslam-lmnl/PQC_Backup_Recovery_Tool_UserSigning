[package]
name = "enc_app"
version = "1.0.0"
edition = "2021"

[dependencies]
pqcrypto-mlkem = "0.1"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
rand = "0.8"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"] }
thiserror = "1.0"
zeroize = { version = "1", features = ["zeroize_derive"] }
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
sharks = "0.5"
